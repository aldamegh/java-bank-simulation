<g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21"><text x="44" y="169" fill="#5eead4" xml:space="preserve">$ java -cp build BankDemo</text><text x="44" y="198" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="227" fill="#dbe5f4" xml:space="preserve">Fictional starting balances</text><text x="44" y="256" fill="#dbe5f4" xml:space="preserve">DemoAlice 1000.0 SR</text><text x="44" y="285" fill="#dbe5f4" xml:space="preserve">DemoBob 500.0 SR</text><text x="44" y="314" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="343" fill="#dbe5f4" xml:space="preserve">Deposit 200 to DemoAlice: true</text><text x="44" y="372" fill="#dbe5f4" xml:space="preserve">Transfer 300 to DemoBob: true</text><text x="44" y="401" fill="#dbe5f4" xml:space="preserve">Withdraw 900 from DemoBob: false</text><text x="44" y="430" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="459" fill="#dbe5f4" xml:space="preserve">Final balances</text><text x="44" y="488" fill="#dbe5f4" xml:space="preserve">DemoAlice 900.0 SR</text><text x="44" y="517" fill="#dbe5f4" xml:space="preserve">DemoBob 800.0 SR</text><text x="44" y="546" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="575" fill="#dbe5f4" xml:space="preserve">The withdrawal is rejected: insufficient balance.</text></g>
